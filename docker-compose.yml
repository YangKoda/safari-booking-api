version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safari-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safari_admin
      POSTGRES_PASSWORD: safari_dev_password_2026
      POSTGRES_DB: safari_booking_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safari_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
